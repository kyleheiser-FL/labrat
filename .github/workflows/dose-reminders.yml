name: Dose Reminder Cron

# Vercel Hobby plan caps crons at once/day, so we poll the reminder endpoint
# from GitHub Actions instead. /api/send-reminders uses catch-up semantics:
# it sends once a user's reminder time has passed (within a 90-minute grace)
# and a per-day pushGuard dedupes — so periodic polling delivers every reminder
# exactly once. Every 15 minutes stays comfortably inside the grace even when
# GitHub's best-effort scheduler skips a couple of ticks, while generating far
# fewer runs/logs than the old every-10-minute schedule.

on:
  schedule:
    - cron: '5,20,35,50 * * * *'
  workflow_dispatch: {} # allow manual runs for testing

# Least privilege — the job only makes outbound HTTP calls.
permissions:
  contents: read

# Don't let a slow run stack on top of the next scheduled tick.
concurrency:
  group: dose-reminders
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger send-reminders
        run: |
          # -L --location-trusted: the apex domain 307-redirects (e.g. to www);
          # follow it and re-send the Authorization header to our own domain.
          code=$(curl -sSL --location-trusted -m 60 -o /tmp/body.txt -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://labratapp.app/api/send-reminders)
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::send-reminders returned HTTP $code"
            cat /tmp/body.txt || true
            exit 1
          fi
