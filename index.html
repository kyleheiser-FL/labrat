<!doctype html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#030712" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#030712" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#030712" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/labrat_icon.svg" />
  <link rel="alternate icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="alternate icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <title>LabRat</title>
</head>

<body>
  <script>
    function escapeHtml(unsafe) {
      return (unsafe || '').toString()
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Startup error diagnostics for older iOS WebKit/Safari and restricted environments
    window.addEventListener('error', function(e) {
      var root = document.getElementById('root');
      if (!root || root.innerHTML === '' || root.children.length === 0) {
        var div = document.createElement('div');
        div.style.position = 'fixed';
        div.style.inset = '0';
        div.style.background = '#030712';
        div.style.color = '#f1f5f9';
        div.style.padding = '24px';
        div.style.fontFamily = 'system-ui, -apple-system, sans-serif';
        div.style.zIndex = '999999';
        div.style.display = 'flex';
        div.style.flexDirection = 'column';
        div.style.justifyContent = 'center';
        div.style.alignItems = 'center';
        div.style.textAlign = 'center';
        div.innerHTML = '<div style="max-width:480px; background:#0b1329; border:1px solid #1e293b; padding:28px; border-radius:16px; box-shadow:0 20px 50px rgba(0,0,0,0.5);">' +
                        '<div style="text-align:center; font-size:42px; margin-bottom:12px;">🧪</div>' +
                        '<h2 style="font-size:20px; font-weight:700; color:#22d3ee; margin:0 0 10px 0;">LabRat Startup Diagnostic</h2>' +
                        '<p style="color:#ef4444; font-size:14px; margin-bottom:16px; font-family:monospace; word-break:break-all;">' + escapeHtml(e.message || 'JavaScript load failure') + '</p>' +
                        '<div style="text-align:left; background:rgba(30,41,59,0.4); padding:12px; border-radius:8px; font-size:11px; font-family:monospace; color:#94a3b8; margin-bottom:16px;">' +
                        'URL: ' + escapeHtml(window.location.href) + '<br>' +
                        'File: ' + escapeHtml(e.filename ? e.filename.split('/').pop() : 'unknown') + '<br>' +
                        'Line: ' + escapeHtml(e.lineno) + ':' + escapeHtml(e.colno) +
                        '</div>' +
                        '<p style="font-size:13px; color:#94a3b8; line-height:1.5;">This can be caused by restricted browser cookie settings blocking LocalStorage access, an outdated browser version, or private browsing mode constraints.</p>' +
                        '<div style="margin-top:20px;"><button onclick="window.location.reload(true)" style="background:#22d3ee; color:#030712; border:none; padding:10px 20px; border-radius:8px; font-weight:bold; font-size:13px; cursor:pointer;">Refresh Page</button></div>' +
                        '</div>';
        document.body.appendChild(div);
      }
    });

    window.addEventListener('unhandledrejection', function(e) {
      var root = document.getElementById('root');
      if (!root || root.innerHTML === '' || root.children.length === 0) {
        var div = document.createElement('div');
        div.style.position = 'fixed';
        div.style.inset = '0';
        div.style.background = '#030712';
        div.style.color = '#f1f5f9';
        div.style.padding = '24px';
        div.style.fontFamily = 'system-ui, -apple-system, sans-serif';
        div.style.zIndex = '999999';
        div.style.display = 'flex';
        div.style.flexDirection = 'column';
        div.style.justifyContent = 'center';
        div.style.alignItems = 'center';
        div.style.textAlign = 'center';
        div.innerHTML = '<div style="max-width:480px; background:#0b1329; border:1px solid #1e293b; padding:28px; border-radius:16px; box-shadow:0 20px 50px rgba(0,0,0,0.5);">' +
                        '<div style="text-align:center; font-size:42px; margin-bottom:12px;">🔒</div>' +
                        '<h2 style="font-size:20px; font-weight:700; color:#22d3ee; margin:0 0 10px 0;">LabRat Sandboxed Context Alert</h2>' +
                        '<p style="color:#f59e0b; font-size:14px; margin-bottom:16px; font-family:monospace; word-break:break-all;">Storage Security Restriction</p>' +
                        '<p style="font-size:13px; color:#94a3b8; line-height:1.5;">Your browser or iframe wrapper has blocked cookie & local storage reads. Please use a standard non-private tab of Safari, iOS Messages, or Google Chrome.</p>' +
                        '</div>';
        document.body.appendChild(div);
      }
    });
  </script>

  <script>
    // Register LabRat service worker early for PWABuilder/Lighthouse detection.
    // Do NOT unregister this automatically, or Android install can break.
    (function () {
      if (!("serviceWorker" in navigator)) return;
      if (!window.isSecureContext) return;
      if (window.location.hostname.indexOf("localhost") !== -1) return;

      var registerLabRatServiceWorker = function () {
        return navigator.serviceWorker
          .register("/sw.js", { scope: "/", updateViaCache: "none" })
          .then(function (registration) {
            console.log("LabRat service worker registered:", registration.scope);
            return registration;
          })
          .catch(function (error) {
            console.warn("LabRat service worker registration failed:", error);
          });
      };

      window.__registerLabRatServiceWorker = registerLabRatServiceWorker;
      registerLabRatServiceWorker();
    })();
  </script>

  <script>
    // Self-healing bootstrap watchdog check
    (function() {
      var nowTimestamp = Date.now();
      var lastSelfHealingReload = sessionStorage.getItem('labrat_last_reloaded');
      var recentReload = lastSelfHealingReload && (nowTimestamp - parseInt(lastSelfHealingReload, 10) < 15000);

      setTimeout(function() {
        if (!window.__LABRAT_MOUNTED__) {
          console.warn('[Watchdog] LabRat App failed to mount within 6.5s limit. Activating recovery prompt...');

          if (recentReload) {
            console.error('[Watchdog] Recovery reload attempted too recently. Aborting automatic reload to prevent loop.');

            var errDiv = document.createElement('div');
            errDiv.style.position = 'fixed';
            errDiv.style.inset = '0';
            errDiv.style.background = '#030712';
            errDiv.style.color = '#f1f5f9';
            errDiv.style.padding = '24px';
            errDiv.style.fontFamily = 'system-ui, -apple-system, sans-serif';
            errDiv.style.zIndex = '999999';
            errDiv.style.display = 'flex';
            errDiv.style.flexDirection = 'column';
            errDiv.style.justifyContent = 'center';
            errDiv.style.alignItems = 'center';
            errDiv.style.textAlign = 'center';
            errDiv.innerHTML = '<div style="max-width:480px; background:#0b1329; border:1px solid #1e293b; padding:28px; border-radius:16px; box-shadow:0 20px 50px rgba(0,0,0,0.5);">' +
                            '<div style="text-align:center; font-size:42px; margin-bottom:12px;">🧪</div>' +
                            '<h2 style="font-size:20px; font-weight:700; color:#22d3ee; margin:0 0 10px 0;">LabRat Portal Connection</h2>' +
                            '<p style="color:#f59e0b; font-size:14px; margin-bottom:16px; font-family:monospace;">Connection Stood by Safely</p>' +
                            '<p style="font-size:13px; color:#94a3b8; line-height:1.5; margin-bottom:16px;">The secure environment cache may need to be refreshed.</p>' +
                            '<div><button id="purge-button" style="background:#22d3ee; color:#030712; border:none; padding:12px 24px; border-radius:8px; font-weight:bold; font-size:13px; cursor:pointer;">Clear Cache & Reload</button></div>' +
                            '</div>';
            document.body.appendChild(errDiv);

            var btn = document.getElementById('purge-button');
            if (btn) {
              btn.addEventListener('click', function() {
                sessionStorage.removeItem('labrat_last_reloaded');

                if ('caches' in window) {
                  caches.keys().then(function(names) {
                    for (var i = 0; i < names.length; i++) {
                      caches.delete(names[i]);
                    }
                  });
                }

                setTimeout(function() {
                  window.location.reload(true);
                }, 500);
              });
            }

            return;
          }

          sessionStorage.setItem('labrat_last_reloaded', nowTimestamp.toString());

          console.log('[Watchdog] Reloading page once for recovery...');
          setTimeout(function() {
            window.location.reload(true);
          }, 600);
        }
      }, 6500);
    })();
  </script>

  <div id="root">
    <div class="labrat-initial-loader" aria-label="Loading LabRat">
      <script>
        (function () {
          try {
            var keys = [
              'labrat_theme',
              'labratTheme',
              'labrat_selected_theme',
              'labrat-pwa-icon-theme',
              'labrat_pwa_icon_theme'
            ];
            var value = '';
            for (var i = 0; i < keys.length; i++) {
              value = window.localStorage.getItem(keys[i]) || value;
            }
            var normalized = String(value || '').toLowerCase();
            document.documentElement.setAttribute(
              'data-loader-theme',
              normalized.indexOf('neon') >= 0 ? 'neon' : 'clinical'
            );
          } catch (e) {
            document.documentElement.setAttribute('data-loader-theme', 'clinical');
          }
        })();
      </script>
      <style>
        .labrat-initial-loader {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          gap: 18px;
          background:
            radial-gradient(circle at 50% 42%, rgba(14, 165, 233, 0.13), transparent 34%),
            radial-gradient(circle at 50% 58%, rgba(34, 197, 94, 0.08), transparent 38%),
            #000;
          font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          color: #e5edf8;
          z-index: 999999;
          user-select: none;
          overflow: hidden;
        }

        .labrat-initial-loader::before {
          content: "";
          position: absolute;
          inset: -30%;
          background-image:
            linear-gradient(rgba(56, 189, 248, 0.045) 1px, transparent 1px),
            linear-gradient(90deg, rgba(56, 189, 248, 0.04) 1px, transparent 1px);
          background-size: 54px 54px;
          mask-image: radial-gradient(circle at center, black 0%, transparent 62%);
          opacity: 0.55;
          transform: rotate(-6deg);
        }

        .labrat-loader-card {
          position: relative;
          width: 132px;
          height: 132px;
          border-radius: 34px;
          display: grid;
          place-items: center;
          background: linear-gradient(145deg, rgba(15, 23, 42, 0.96), rgba(2, 6, 23, 0.98));
          border: 1px solid rgba(148, 163, 184, 0.28);
          box-shadow:
            0 24px 60px rgba(0, 0, 0, 0.55),
            inset 0 1px 0 rgba(255, 255, 255, 0.10);
          overflow: hidden;
        }

        .labrat-loader-card::after {
          content: "";
          position: absolute;
          inset: -3px;
          border-radius: inherit;
          border: 2px solid rgba(59, 130, 246, 0.45);
          filter: blur(7px);
          opacity: 0.75;
          animation: labrat-loader-glow 1.8s ease-in-out infinite alternate;
        }

        html[data-loader-theme="neon"] .labrat-loader-card::after {
          border-color: rgba(34, 211, 238, 0.74);
          box-shadow: 0 0 30px rgba(34, 211, 238, 0.34), 0 0 45px rgba(34, 197, 94, 0.22);
        }

        .labrat-loader-icon {
          position: relative;
          z-index: 2;
          width: 104px;
          height: 104px;
          object-fit: contain;
          filter: drop-shadow(0 0 18px rgba(125, 211, 252, 0.22));
        }

        html[data-loader-theme="clinical"] .labrat-loader-icon-neon,
        html[data-loader-theme="neon"] .labrat-loader-icon-clinical {
          display: none;
        }

        .labrat-loader-wordmark {
          position: relative;
          z-index: 1;
          display: flex;
          align-items: center;
          gap: 10px;
          font-size: clamp(2rem, 6vw, 3.25rem);
          font-weight: 950;
          line-height: 0.9;
          letter-spacing: -0.08em;
          text-transform: uppercase;
          color: #f8fafc;
          text-shadow: 0 0 28px rgba(148, 163, 184, 0.18);
        }

        html[data-loader-theme="neon"] .labrat-loader-wordmark {
          background: linear-gradient(90deg, #22d3ee 0%, #38bdf8 42%, #22c55e 100%);
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
          text-shadow: 0 0 28px rgba(34, 211, 238, 0.34);
        }

        .labrat-loader-status {
          position: relative;
          z-index: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 12px;
          min-width: 220px;
        }

        .labrat-loader-bar {
          width: min(280px, 58vw);
          height: 5px;
          border-radius: 999px;
          background: rgba(30, 41, 59, 0.9);
          overflow: hidden;
          border: 1px solid rgba(148, 163, 184, 0.14);
        }

        .labrat-loader-bar::before {
          content: "";
          display: block;
          width: 46%;
          height: 100%;
          border-radius: inherit;
          background: linear-gradient(90deg, #60a5fa, #93c5fd);
          animation: labrat-loader-progress 1.45s ease-in-out infinite;
        }

        html[data-loader-theme="neon"] .labrat-loader-bar::before {
          background: linear-gradient(90deg, #06b6d4, #22d3ee, #22c55e);
          box-shadow: 0 0 18px rgba(34, 211, 238, 0.55);
        }

        .labrat-loader-caption {
          font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
          font-size: 11px;
          font-weight: 800;
          letter-spacing: 0.18em;
          text-transform: uppercase;
          color: #94a3b8;
        }

        html[data-loader-theme="neon"] .labrat-loader-caption {
          color: #67e8f9;
          text-shadow: 0 0 16px rgba(34, 211, 238, 0.38);
        }

        @keyframes labrat-loader-glow {
          from { opacity: 0.42; transform: scale(0.985); }
          to { opacity: 0.92; transform: scale(1.015); }
        }

        @keyframes labrat-loader-progress {
          0% { transform: translateX(-115%); }
          50% { transform: translateX(58%); }
          100% { transform: translateX(235%); }
        }
      </style>

      <div class="labrat-loader-card">
        <img class="labrat-loader-icon labrat-loader-icon-clinical" src="/pwa-icons/lr-clinical-512.png" alt="LabRat clinical LR logo" onerror="this.onerror=null;this.src='/icon_512.png';" />
        <img class="labrat-loader-icon labrat-loader-icon-neon" src="/pwa-icons/lr-neon-512.png" alt="LabRat neon LR logo" onerror="this.onerror=null;this.src='/labrat_top_left_logo_transparent.png';" />
      </div>
      <div class="labrat-loader-wordmark">LABRAT</div>
      <div class="labrat-loader-status">
        <div class="labrat-loader-bar"></div>
        <div class="labrat-loader-caption">Loading biochemical command center</div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
