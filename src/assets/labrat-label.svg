<svg width="340" height="200" viewBox="0 0 340 200" xmlns="http://www.w3.org/2000/svg">
  <!-- ───────────────────────────────────────────────────────────────────────
       LABRAT research-vial label — digital asset recreated from the physical
       holographic foil labels. Dark gunmetal stock with an iridescent foil
       wordmark, strength block, research pictograms and the red use banner.
       Product name + strength are the two editable text nodes (#labelName,
       #labelStrength). Reused as the design language for procedural vials.
  ──────────────────────────────────────────────────────────────────────── -->
  <defs>
    <linearGradient id="labelStock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#1e293b"/>
      <stop offset="48%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="holoFoil" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#22d3ee"/>
      <stop offset="22%"  stop-color="#a78bfa"/>
      <stop offset="44%"  stop-color="#f472b6"/>
      <stop offset="64%"  stop-color="#fbbf24"/>
      <stop offset="84%"  stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="holoBand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0e7490" stop-opacity="0.55"/>
      <stop offset="25%"  stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="50%"  stop-color="#db2777" stop-opacity="0.55"/>
      <stop offset="75%"  stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- Label stock -->
  <rect x="2" y="2" width="336" height="196" rx="14" fill="url(#labelStock)" stroke="#334155" stroke-width="1.5"/>
  <!-- Holographic sheen sweep -->
  <rect x="2" y="2" width="336" height="196" rx="14" fill="url(#holoBand)" opacity="0.18"/>

  <!-- Brand header -->
  <text x="170" y="42" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif"
        font-size="34" font-weight="900" letter-spacing="4" fill="url(#holoFoil)">LABRAT</text>
  <text x="170" y="58" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="10" font-weight="700" letter-spacing="6" fill="#94a3b8">P E P T I D E S</text>

  <!-- Iridescent divider -->
  <rect x="40" y="66" width="260" height="2" rx="1" fill="url(#holoFoil)" opacity="0.85"/>

  <!-- Product name -->
  <text id="labelName" x="170" y="98" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif"
        font-size="26" font-weight="800" fill="#f8fafc">PRODUCT</text>

  <!-- Strength block -->
  <rect x="130" y="110" width="80" height="26" rx="6" fill="url(#holoFoil)"/>
  <text id="labelStrength" x="170" y="128" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="16" font-weight="900" letter-spacing="1" fill="#0f172a">10 MG</text>

  <!-- Research pictograms -->
  <g transform="translate(0,150)" fill="none" stroke="#cbd5e1" stroke-width="1.6">
    <!-- not for human consumption -->
    <g transform="translate(70,0)">
      <circle cx="0" cy="0" r="11"/>
      <line x1="-7.8" y1="-7.8" x2="7.8" y2="7.8"/>
      <circle cx="0" cy="-3.5" r="2.4" fill="#cbd5e1" stroke="none"/>
      <path d="M-4 5 Q0 -1 4 5" />
    </g>
    <!-- research only (flask) -->
    <g transform="translate(170,0)">
      <path d="M-4 -10 L-4 -3 L-10 8 Q-11 11 -7 11 L7 11 Q11 11 10 8 L4 -3 L4 -10"/>
      <line x1="-6" y1="-10" x2="6" y2="-10"/>
      <line x1="-7" y1="4" x2="7" y2="4"/>
    </g>
    <!-- store cold 2-8°C (thermometer) -->
    <g transform="translate(270,0)">
      <path d="M0 -10 a3 3 0 0 1 3 3 L3 4 a4.5 4.5 0 1 1 -6 0 L-3 -7 a3 3 0 0 1 3 -3 Z"/>
      <circle cx="0" cy="7" r="2.4" fill="#cbd5e1" stroke="none"/>
      <line x1="0" y1="-3" x2="0" y2="6" stroke="#cbd5e1" stroke-width="1.6"/>
    </g>
  </g>
  <g font-family="system-ui, sans-serif" font-size="5.5" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="0.3">
    <text x="70"  y="176">NOT FOR HUMAN</text>
    <text x="70"  y="183">CONSUMPTION</text>
    <text x="170" y="176">RESEARCH</text>
    <text x="170" y="183">PURPOSE ONLY</text>
    <text x="270" y="176">STORE BETWEEN</text>
    <text x="270" y="183">2&#176;C – 8&#176;C</text>
  </g>

  <!-- Use banner -->
  <rect x="2" y="186" width="336" height="0.5" fill="#334155"/>
</svg>
